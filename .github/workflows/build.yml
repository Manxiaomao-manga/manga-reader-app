name: Build & Release APK
# Release signing is supplied through the repository's stable signing secrets.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin the SDK so a future stable release cannot silently change
          # Android's minimum Gradle requirement and break CI.
          flutter-version: '3.47.0'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Release APKs must always use the same signing key. The keystore and
      # passwords are stored only in GitHub Actions Secrets and are never
      # committed to this repository.
      - name: Configure stable release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/manga-release.jks
          cat > android/key.properties <<EOF
          storeFile=manga-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # IMPORTANT: create local.properties BEFORE any Gradle step
      # settings.gradle reads this file at startup to locate Flutter SDK.
      # versionCode/versionName are parsed from pubspec.yaml's "version: x.y.z+N"
      # line so the APK's embedded version always matches pubspec.yaml —
      # the in-app update checker compares against this, so it must never
      # be stuck at a hardcoded value.
      - name: Create local.properties
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          echo "Parsed version: $VERSION_NAME+$VERSION_CODE"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties

      # This repository predates a checked-in Gradle wrapper.  Generate a
      # matching wrapper for this CI workspace before Flutter invokes Gradle.
      - name: Set up Gradle for wrapper generation
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          printf "rootProject.name = 'wrapper-generator'\\n" > settings.gradle
          gradle wrapper --gradle-version 8.14
          cp gradlew "$GITHUB_WORKSPACE/android/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MangaXiaomao.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaXiaomao-apk
          path: MangaXiaomao.apk
          if-no-files-found: error

      - name: Create / Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "MangaXiaomao.apk"
          tag: "v1"
          name: "漫小猫 App v1"
          body: |
            ## 漫小猫 Android App

            **安装方法：**
            1. 下载 `MangaXiaomao.apk`
            2. 手机打开，若提示「安装未知来源应用」请点击「设置」并开启
            3. 返回安装，点击「安装」即可

            **功能：**
            - 完整网站功能（登录 / 充值 / 阅读）
            - 底部导航：首页 / 分类 / 书架 / 我的
            - 支持章节离线下载（PWA 快取）
            - 下拉刷新，返回键在页内后退
            - 全屏沉浸式阅读体验
            - 原生启动画面
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # IMPORTANT: create local.properties BEFORE any Gradle step
      # settings.gradle reads this file at startup to locate Flutter SDK
      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "flutter.versionCode=2" >> android/local.properties
          echo "flutter.versionName=2.0.0" >> android/local.properties

      # Generate gradlew in a temp dir to avoid triggering Flutter project evaluation
      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Generate Gradle wrapper in temp dir
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          echo "rootProject.name = 'temp'" > settings.gradle
          gradle wrapper --gradle-version 8.3
          cp gradlew "$GITHUB_WORKSPACE/android/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"
          echo "Wrapper generated:"
          ls -la "$GITHUB_WORKSPACE/android/gradle/wrapper/"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MangaXiaomao.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaXiaomao-apk
          path: MangaXiaomao.apk
          if-no-files-found: error

      - name: Create / Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "MangaXiaomao.apk"
          tag: "v1"
          name: "漫小猫 App v1"
          body: |
            ## 漫小猫 Android App

            **安装方法：**
            1. 下载 `MangaXiaomao.apk`
            2. 手机打开，若提示「安装未知来源应用」请点击「设置」并开启
            3. 返回安装，点击「安装」即可

            **功能：**
            - 完整网站功能（登录 / 充值 / 阅读）
            - 底部导航：首页 / 搜索 / 书库 / 我的
            - 支持章节离线下载（PWA 快取）
            - 下拉刷新，返回键在页内后退
            - 全屏沉浸式阅读体验
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

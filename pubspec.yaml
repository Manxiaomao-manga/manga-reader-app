name: manga_xiaomao
description: 漫小猫 - 漫画阅读 App

publish_to: 'none'

version: 2.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^10.2.1
  http: ^1.6.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1a1a2e"
  image: assets/icon.png
  android_12:
    color: "#1a1a2e"
    image: assets/icon.png
  android: true
  ios: false
